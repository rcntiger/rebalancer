<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리밸런서</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4A90D9;--buy:#2ECC7A;--sell:#E85555;--sellc:#4A90E2;--warn:#E8A020;
  --ac0:#4A90D9;--ac1:#2ECC7A;--ac2:#E8A020;--ac3:#C06AF0;--ac4:#E85555;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  /* ── 글자 크기 스케일 (JS에서 --fs 값을 변경) ── */
  --fs:1;        /* 기본 배율 (small=0.85, normal=1, large=1.15, xlarge=1.3) */
  --f-xs:  calc(15px * var(--fs));
  --f-sm:  calc(17px * var(--fs));
  --f-md:  calc(19px * var(--fs));
  --f-lg:  calc(27px * var(--fs));
  --f-xl:  calc(22px * var(--fs));
  --f-2xl: calc(28px * var(--fs));
  --f-3xl: calc(32px * var(--fs));
}
[data-theme=dark]{
  --bg:#080C12;--s1:#0F1520;--s2:#161E2E;--s3:#1E2A3E;
  --bd:#253047;--bd2:#2E3D58;--t1:#C8D8EC;--t2:#6B84A0;--t3:#344560;
}
[data-theme=light]{
  --bg:#EEF3FB;--s1:#FFFFFF;--s2:#F5F8FF;--s3:#EAF0FA;
  --bd:#DDE6F5;--bd2:#C8D6EC;--t1:#1A2540;--t2:#6B7A99;--t3:#B0BAD0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--t1);font-size:var(--f-md);}

/* ── 앱 셸 ── */
#app-shell{
  display:flex;flex-direction:column;
  height:100vh;
  overflow:hidden; /* 셸 자체는 스크롤 없음 */
}
#appbar{
  flex-shrink:0;
  background:var(--s1);border-bottom:1px solid var(--bd);
  height:52px;padding:0 14px;
  display:flex;align-items:center;gap:8px;
}
#appbar h1{font-size:var(--f-lg);font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;}
#tabbar{
  flex-shrink:0;
  background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;
}
#scroll-area{
  flex:1;
  overflow-y:auto;
  position:relative; /* FAB 기준 */
}

/* ── 탭 ── */
.tab{flex:1;padding:10px 0 8px;text-align:center;font-size:17px;color:var(--t2);
  cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;font-weight:500;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-icon{font-size:var(--f-md);display:block;margin-bottom:2px;}
.panel{display:none;padding-bottom:80px;animation:fadeUp .2s ease;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── 공통 ── */
.icon-btn{width:42px;height:42px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
  color:var(--t2);transition:background .15s,color .15s;position:relative;flex-shrink:0;}
.icon-btn:hover{background:var(--s3);color:var(--t1);}
.spacer{flex:1;}
.accent-dot{position:absolute;bottom:2px;right:2px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);border:1.5px solid var(--s1);}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;
  margin:4px 12px;overflow:hidden;}
.card:hover{border-color:var(--bd2);}
.row{display:flex;align-items:center;}
.col{display:flex;flex-direction:column;}
.mono{font-family:var(--mono);}
.sec-lbl{padding:12px 14px 5px;font-size:var(--f-md);color:var(--t1);letter-spacing:.3px;text-transform:uppercase;font-weight:700;}
.tag{padding:3px 9px;border-radius:5px;font-size:var(--f-xs);font-weight:600;}
.tag-warn{background:rgba(232,160,32,.12);border:1px solid rgba(232,160,32,.3);color:var(--warn);}
.tag-ok{background:rgba(46,204,122,.1);border:1px solid rgba(46,204,122,.25);color:var(--buy);}
.alert{margin:3px 12px;padding:10px 14px;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:16px;}
.alert-warn{background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.3);color:var(--warn);}

/* ── 히어로 ── */
.hero{margin:12px;padding:18px;border-radius:16px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent),var(--s1) 65%);
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);}
.hero-total{font-family:var(--mono);font-size:var(--f-3xl);font-weight:500;color:var(--t1);letter-spacing:-.5px;margin:4px 0 6px;}
.kpi-row{display:flex;gap:7px;margin-top:12px;}
.kpi{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:8px 6px;text-align:center;}
.kpi-l{font-size:16px;color:var(--t3);margin-bottom:3px;}
.kpi-v{font-family:var(--mono);font-size:16px;font-weight:500;}

/* ── 계좌 카드 ── */
.acc-card{padding:13px;cursor:pointer;}
.acc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.acc-name{font-size:17px;font-weight:600;color:var(--t1);flex:1;margin:0 8px;}
.mkt-badge{font-size:var(--f-xs);font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:4px;}
.mkt-krx{background:rgba(52,99,255,.15);color:#6FA3FF;}
.mkt-us{background:rgba(255,80,80,.12);color:#FF8A8A;}
.stack-bar{height:5px;border-radius:3px;overflow:hidden;display:flex;gap:1px;background:var(--s2);margin-top:10px;}

/* ── FAB ── */
.fab{position:sticky;bottom:18px;float:right;margin-right:18px;
  width:50px;height:50px;border-radius:15px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:21px;
  cursor:pointer;border:none;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .15s,box-shadow .15s;z-index:5;}
.fab:hover{transform:scale(1.06);}

/* ── 리밸런싱 ── */
.acc-selector{background:var(--s1);border-bottom:1px solid var(--bd);
  padding:7px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.acc-selector::-webkit-scrollbar{display:none;}
.acc-pill{padding:5px 13px;border-radius:20px;font-size:var(--f-xs);border:1.5px solid var(--bd);
  color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .15s;
  background:transparent;font-family:var(--sans);}
.reb-summary{margin:8px 12px;border:1px solid var(--bd);border-radius:11px;overflow:hidden;display:flex;background:var(--s1);}
.reb-cell{flex:1;padding:11px 8px;text-align:center;border-right:1px solid var(--bd);}
.reb-cell:last-child{border-right:none;}
.reb-cl{font-size:var(--f-xs);color:var(--t3);margin-bottom:3px;}
.reb-cv{font-family:var(--mono);font-size:var(--f-sm);font-weight:600;}
.status-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bd);}
.refresh-btn{margin-left:auto;display:flex;align-items:center;gap:4px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  color:var(--accent);padding:5px 11px;border-radius:8px;
  font-size:8px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.action-card{margin:3px 12px;background:var(--s1);border:1px solid var(--bd);
  border-radius:11px;padding:12px;display:flex;align-items:center;gap:10px;}
.action-card:hover{border-color:var(--bd2);}
.ab{width:44px;padding:6px 0;border-radius:8px;text-align:center;flex-shrink:0;}
.ab-icon{font-size:var(--f-md);display:block;}
.ab-lbl{font-size:var(--f-xs);font-weight:700;display:block;margin-top:1px;}
.ab-buy{background:rgba(46,204,122,.12);color:var(--buy);}
.ab-sell{background:rgba(74,144,226,.12);color:var(--sellc);}
.ab-hold{background:rgba(100,130,160,.08);color:var(--t3);}
.broker-card{margin:10px 12px;padding:13px 15px;background:var(--s2);
  border:1px solid var(--bd2);border-radius:11px;display:flex;align-items:center;gap:12px;}

/* ── 계좌 상세 패널 ── */
#detail-panel{display:none;flex-direction:column;}
#detail-panel.open{display:flex;}
#detail-panel .back-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:12px 14px;background:var(--s1);border-bottom:1px solid var(--bd);cursor:pointer;}
#detail-panel .back-bar:hover .back-lbl{color:var(--accent);}
.back-lbl{font-size:20px;color:var(--t2);transition:color .15s;}
.detail-header{margin:12px;padding:15px;border-radius:13px;}
.stock-row{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;}
.stock-row:last-child{border-bottom:none;}
.w-col{width:72px;}
.wm-bar{height:4px;background:var(--s2);border-radius:2px;position:relative;overflow:hidden;margin-top:3px;}
.wm-t{position:absolute;top:0;left:0;bottom:0;border-radius:2px;background:color-mix(in srgb,var(--accent) 25%,transparent);}
.wm-f{position:absolute;top:0;left:0;bottom:0;border-radius:2px;}
.act-btn{font-size:20px;cursor:pointer;padding:3px 7px;border-radius:6px;
  border:1px solid var(--bd);background:var(--s2);}

/* ── 차트 ── */
.scope-bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--s1);}
.scope-btn{padding:5px 14px;border-radius:16px;font-size:var(--f-xs);border:1px solid var(--bd);
  color:var(--t2);cursor:pointer;font-weight:500;background:transparent;font-family:var(--sans);}
.scope-btn.active{background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-color:var(--accent);color:var(--accent);font-weight:700;}
.alloc-wrap{margin:12px;}
.alloc-bar{height:22px;border-radius:7px;overflow:hidden;display:flex;gap:1px;}
.alloc-seg{display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#fff;font-weight:600;font-family:var(--mono);overflow:hidden;}
.legend-box{margin:0 12px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;}
.legend-row{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--bd);}
.legend-row:last-child{border-bottom:none;}

/* ── 모달 / 시트 ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;}
.modal-bg.open{display:flex;align-items:center;justify-content:center;padding:16px;}
.sheet{width:100%;max-width:520px;background:var(--s1);border-radius:16px;
  border:1px solid var(--bd2);padding:24px 22px 28px;max-height:90vh;overflow-y:auto;
  animation:dlgIn .18s ease;}
@keyframes dlgIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.sheet-handle{display:none;}
.sheet h3{font-size:var(--f-lg);font-weight:700;margin-bottom:16px;color:var(--t1);}
.field{margin-bottom:13px;}
.field label{display:block;font-size:var(--f-sm);color:var(--t2);margin-bottom:5px;font-weight:500;}
.field input,.field select{width:100%;background:var(--s2);border:1px solid var(--bd);
  border-radius:9px;color:var(--t1);padding:11px 13px;font-size:var(--f-md);
  font-family:var(--sans);outline:none;transition:border-color .15s;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field select option{background:var(--s2);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.mkt-toggle{display:flex;gap:8px;margin-bottom:13px;}
.mkt-btn{flex:1;padding:9px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);
  color:var(--t2);font-size:var(--f-sm);cursor:pointer;text-align:center;font-family:var(--sans);}
.mkt-btn.active{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--accent);font-weight:700;}
.sheet-btns{display:flex;gap:8px;margin-top:18px;}
.btn-ghost{flex:1;padding:12px;background:none;border:1px solid var(--bd);border-radius:9px;
  color:var(--t2);font-size:var(--f-sm);cursor:pointer;font-family:var(--sans);}
.btn-primary{flex:2;padding:12px;background:var(--accent);border:none;border-radius:9px;
  color:#fff;font-size:var(--f-sm);font-weight:600;cursor:pointer;font-family:var(--sans);}
.btn-edit{background:var(--warn)!important;}

/* ── PIN ── */
.pin-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;}
.pin-bg.open{display:flex;align-items:center;justify-content:center;}
.pin-box{background:var(--s1);border:1px solid var(--bd2);border-radius:20px;
  padding:28px 24px 22px;width:310px;text-align:center;}
.pin-icon{width:52px;height:52px;border-radius:50%;margin:0 auto 13px;
  display:flex;align-items:center;justify-content:center;font-size:21px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 6px;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--bd2);transition:all .12s;}
.pin-dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15);}
.pin-err{font-size:var(--f-xs);color:var(--sell);min-height:18px;margin-bottom:12px;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:0 auto;}
.pk{height:54px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;
  font-size:var(--f-xl);color:var(--t1);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:background .1s;font-family:var(--sans);user-select:none;}
.pk:hover{background:var(--s3);}
.pk:active{transform:scale(.93);}
.pk.empty{opacity:0;pointer-events:none;}
.pin-cancel{margin-top:8px;font-size:var(--f-sm);color:var(--t2);cursor:pointer;
  display:inline-block;padding:6px 16px;}
.pin-cancel:hover{color:var(--t1);}

/* ── 테마 시트 ── */
.mode-row{display:flex;gap:10px;margin-bottom:18px;}
.mode-btn{flex:1;padding:12px;border-radius:11px;background:var(--s2);border:1px solid var(--bd);
  color:var(--t2);cursor:pointer;text-align:center;}
.mode-btn.active{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--accent);}
.mode-btn .mi{font-size:17px;display:block;margin-bottom:5px;}
.mode-btn .ml{font-size:var(--f-xs);font-weight:600;}
.clr-row{display:flex;justify-content:space-between;margin-bottom:8px;}
.csw{width:42px;height:42px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid transparent;transition:transform .15s;}
.csw.active{border-color:#fff;transform:scale(1.15);}
.cnm-row{display:flex;justify-content:space-between;}
.cnm{width:42px;text-align:center;font-size:var(--f-xs);color:var(--t3);}
.preview{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:16px;}
.pv-lbl{font-size:var(--f-sm);color:var(--t3);letter-spacing:1px;margin-bottom:8px;}

/* ── 설정 ── */
.status-banner{margin:12px;padding:12px 14px;border-radius:10px;
  display:flex;align-items:center;gap:8px;font-size:var(--f-sm);}
.banner-saved{background:rgba(46,204,122,.08);border:1px solid rgba(46,204,122,.25);color:var(--buy);}
.banner-unsaved{background:rgba(232,160,32,.08);border:1px solid rgba(232,160,32,.25);color:var(--warn);}
.guide-box{margin:0 12px 14px;padding:13px;border-radius:11px;
  background:color-mix(in srgb,var(--accent) 7%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);}
.guide-step{display:flex;align-items:flex-start;gap:8px;margin-top:7px;}
.snum{width:17px;height:17px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--accent);flex-shrink:0;}
.info-row{display:flex;justify-content:space-between;margin-bottom:9px;font-size:var(--f-sm);padding:0 12px;}
.info-row span:first-child{color:var(--t2);}
.info-row span:last-child{font-family:var(--mono);}
.test-result{margin:8px 12px;padding:10px;border-radius:8px;font-size:var(--f-sm);}
.tr-ok{background:rgba(46,204,122,.1);border:1px solid rgba(46,204,122,.25);color:var(--buy);}
.tr-fail{background:rgba(232,85,85,.1);border:1px solid rgba(232,85,85,.25);color:var(--sell);}
.btn-row{display:flex;gap:8px;padding:0 12px;}
.btn-outline{flex:1;padding:12px;background:none;border:1px solid var(--accent);
  border-radius:9px;color:var(--accent);font-size:var(--f-sm);cursor:pointer;font-family:var(--sans);}
.btn-save{flex:2;padding:12px;background:var(--accent);border:none;border-radius:9px;
  color:#fff;font-size:var(--f-sm);font-weight:600;cursor:pointer;font-family:var(--sans);}
.iw{position:relative;}
.iw input{padding-right:36px;}
.iw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;
  color:var(--t2);font-size:var(--f-md);user-select:none;}
.crypto-note{padding:10px 12px;background:var(--s2);border:1px solid var(--bd);
  border-radius:8px;font-size:var(--f-xs);color:var(--t2);display:flex;align-items:flex-start;gap:7px;margin-top:5px;}
.hr{margin:18px 12px 14px;border:none;border-top:1px solid var(--bd);}

/* ── 빈상태 ── */
.empty{text-align:center;padding:60px 20px;}
.empty .ei{font-size:49px;opacity:.3;margin-bottom:14px;}
.empty p{color:var(--t2);font-size:var(--f-sm);}
.empty .es{color:var(--t3);font-size:var(--f-xs);margin-top:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;display:inline-block;}

/* ── 프록시 상태 배너 ── */
#proxy-banner{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:#1a0a0a;border-top:1px solid rgba(232,85,85,.4);
  padding:10px 14px;font-size:var(--f-xs);color:#FF9090;
  animation:slideUp .25s ease;
}
#proxy-banner.show{display:flex;align-items:center;gap:8px;}
#proxy-banner.ok{background:#081a10;border-top-color:rgba(46,204,122,.4);color:#6FE8A0;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── 상세 표: 머리줄과 행을 함께 가로 스크롤 ── */
.dt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.dt-row{min-width:100%;width:max-content;box-sizing:border-box;}
.dt-num{white-space:nowrap;}

/* ════════ 모바일 (폭 600px 이하) ════════ */
@media (max-width:600px){
  :root{
    --f-xs:calc(13px * var(--fs));--f-sm:calc(15px * var(--fs));--f-md:calc(16px * var(--fs));
    --f-lg:calc(20px * var(--fs));--f-xl:calc(19px * var(--fs));--f-2xl:calc(23px * var(--fs));--f-3xl:calc(26px * var(--fs));
  }
  /* 앱바 */
  #appbar{padding:0 10px;gap:5px;}
  #appbar h1{font-size:19px;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;gap:5px;}
  #appbar h1 #app-ver{font-size:11px !important;}
  #appbar .spacer{display:none;}
  .icon-btn{width:36px;height:36px;font-size:15px;margin-left:0 !important;}
  .tab{font-size:15px;padding:8px 0 6px;}
  /* 요약 */
  .hero{margin:10px;padding:14px;}
  .kpi-row{flex-wrap:wrap;gap:6px;}
  .kpi{flex:1 1 calc(33.3% - 6px);min-width:0;}
  .kpi-l,.kpi-v{font-size:13px !important;}
  /* 계좌 카드: 정보+도넛 / 아래에 범례 */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

/* ════════════════════════ 상수 ════════════════════════ */
const ACCENTS=[{n:'블루',h:'#4A90D9'},{n:'그린',h:'#2ECC7A'},{n:'퍼플',h:'#C06AF0'},
  {n:'오렌지',h:'#E8A020'},{n:'레드',h:'#E85555'},{n:'티파니',h:'#1EC8C8'}];
const AC=['#4A90D9','#2ECC7A','#E8A020','#C06AF0','#E85555','#00BCD4','#FF6B9D','#8BC34A','#FF9800','#9C27B0'];
const BROKERS=['한국투자증권','삼성증권','키움증권','미래에셋증권','NH투자증권','신한투자증권','KB증권','대신증권','기타'];
const APP_VERSION='2.4.2';
const PROXY_MIN='2.3.0';   // 앱이 요구하는 최소 프록시 버전
const KIS='http://localhost:5000';

/* ── 색상 헬퍼 ──────────────────────────────────────────────
   curW>0인 종목만 표시 순서대로 번호를 매겨 AC[]에서 색상을 고름.
   이렇게 하면 비중 0인 종목이 중간에 있어도 색상이 연속적으로
   할당되고, 범례·도넛·스택바가 동일한 색을 공유한다.
──────────────────────────────────────────────────────────── */
function stockBaseColor(acc, st, anyLoaded){
  if(anyLoaded===undefined) anyLoaded = acc.stocks.some(s => s.loaded);
  let colorIdx = 0;
  for(const s of acc.stocks){
    const w = anyLoaded ? stW(acc, s) : s.tgt;
    if(w <= 0) continue;
    if(s === st) return AC[colorIdx % AC.length];
    colorIdx++;
  }
  return AC[0];
}
function stockDisplayColor(acc, st){
  const anyLoaded = acc.stocks.some(s => s.loaded);
  const baseCol   = stockBaseColor(acc, st, anyLoaded);
  if(!anyLoaded) return baseCol;
  const diff = stW(acc, st) - (st.tgt || 0);
  const thr  = acc.thr || 5;
  return Math.abs(diff) <= thr ? baseCol : diff > 0 ? '#E85555' : '#E8A020';
}

/* ════════════════════════ 앱 상태 ════════════════════════ */
// API 키는 메모리에만 보관 (탭을 닫으면 사라짐 → 다음 실행 시 PIN 1회 입력)
let _keys={ak:'',as:''};
async function getKeys(){
  if(_keys.ak&&_keys.as)return _keys;
  const hash=localStorage.getItem('rb2_pin_hash');
  if(!hash||!localStorage.getItem('rb2_enc_k'))return null;
  const pin=await showPin('verify',hash);if(!pin)return null;
  const ak=await decrypt(localStorage.getItem('rb2_enc_k')||'',pin);
  const as_=await decrypt(localStorage.getItem('rb2_enc_s')||'',pin);
  if(!ak||!as_){alert('복호화 실패');return null;}
  _keys={ak,as:as_};
  return _keys;
}
let S={
  accounts:[],rate:1350,oilPrice:0,us10y:0,updated:null,loading:false,
  isDark:true,accent:0,
  tab:0,selAcc:0,scope:'all',
  keySaved:false,editMode:false,
  detailIdx:-1,
  fsKey:'normal',
  sortDetail:{key:'name',asc:true},
  sortReb:{key:'name',asc:true},
  sortChart:{key:'pct',asc:false},
  sortDash:{key:'name',asc:true},
  chartRange:'30d',
  chartAccFilter:'all',
  detailCols:{price:true,avgPrice:true,profitRate:true,costVal:true,evalVal:true,holdPct:true,qty:true},
  detailBudget:{mode:false,val:''},
};

/* ════════════════════════ 저장/로드 ════════════════════════ */
// 화면에 그대로 들어가는 텍스트에서 HTML 특수문자 제거 (깨짐·스크립트 삽입 방지)
function clean(v){return String(v??'').replace(/[<>"'`]/g,'');}
function sanitizeAccounts(arr){
  (arr||[]).forEach(a=>{
    ['name','broker','memo'].forEach(k=>{if(a[k]!=null)a[k]=clean(a[k]);});
    (a.stocks||[]).forEach(st=>{['name','ticker'].forEach(k=>{if(st[k]!=null)st[k]=clean(st[k]);});});
  });
  return arr;
}
function save(){
  sanitizeAccounts(S.accounts);
  localStorage.setItem('rb2_accs',JSON.stringify(S.accounts));
  localStorage.setItem('rb2_rate',S.rate);
  if(S.updated)localStorage.setItem('rb2_upd',S.updated);
  cloudMarkDirty();
}
function load(){
  try{
    const a=localStorage.getItem('rb2_accs');
    if(a)S.accounts=sanitizeAccounts(JSON.parse(a));
    S.rate=parseFloat(localStorage.getItem('rb2_rate')||'1350');
    S.updated=localStorage.getItem('rb2_upd')||null;
    S.oilPrice=parseFloat(localStorage.getItem('rb2_oil')||'0');
    S.us10y=parseFloat(localStorage.getItem('rb2_us10y')||'0');
    S.isDark=(localStorage.getItem('rb2_theme')||'dark')==='dark';
    S.accent=parseInt(localStorage.getItem('rb2_accent')||'0');
    S.fsKey=localStorage.getItem('rb2_fs')||'normal';
    S.keySaved=!!(localStorage.getItem('rb2_enc_k')&&localStorage.getItem('rb2_enc_s'));
    // 구버전이 남긴 평문 키: 암호화본이 있으면 삭제, 없으면 이번 세션 메모리로만 옮김
    const pk=localStorage.getItem('kis_app_key'),ps=localStorage.getItem('kis_app_secret');
    if(pk&&ps&&!S.keySaved)_keys={ak:pk,as:ps};
    localStorage.removeItem('kis_app_key');localStorage.removeItem('kis_app_secret');
  }catch(e){}
}

/* ════════════════════════ 암호화 ════════════════════════ */
async function deriveKey(pin,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,256));
}
async function hmac(key,data){
  const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC',k,data));
}
async function sha256b(data){return new Uint8Array(await crypto.subtle.digest('SHA-256',data));}
async function hashPin(pin){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function encrypt(text,pin){
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(16));
  const key=await deriveKey(pin,salt);
  const plain=enc.encode(text);
  const cipher=new Uint8Array(plain.length);
  const ctr=iv.slice();
  for(let p=0;p<plain.length;){
    const bl=await sha256b(new Uint8Array([...key,...ctr]));
    const len=Math.min(32,plain.length-p);
    for(let i=0;i<len;i++)cipher[p+i]=plain[p+i]^bl[i];
    p+=len;
    for(let i=ctr.length-1;i>=0;i--){if(++ctr[i])break;}
  }
  const h=await hmac(key,cipher);
  const out=new Uint8Array(16+16+32+cipher.length);
  out.set(salt,0);out.set(iv,16);out.set(h,32);out.set(cipher,64);
  return btoa(String.fromCharCode(...out));
}
async function decrypt(b64,pin){
  try{
    const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),iv=raw.slice(16,32),sh=raw.slice(32,64),cipher=raw.slice(64);
    const key=await deriveKey(pin,salt);
    const eh=await hmac(key,cipher);
    if(!eh.every((v,i)=>v===sh[i]))return null;
    const plain=new Uint8Array(cipher.length);
    const ctr=iv.slice();
    for(let p=0;p<cipher.length;){
      const bl=await sha256b(new Uint8Array([...key,...ctr]));
      const len=Math.min(32,cipher.length-p);
      for(let i=0;i<len;i++)plain[p+i]=cipher[p+i]^bl[i];
      p+=len;
      for(let i=ctr.length-1;i>=0;i--){if(++ctr[i])break;}
    }
    return new TextDecoder().decode(plain);
  }catch(e){return null;}
}

/* ════════════════════════ PIN 다이얼로그 ════════════════════════ */
let _pinResolve=null,_pinMode='verify',_pinStep=1,_pinFirst='',_pinCur='',_pinHash=null;

function showPin(mode,hash){
  return new Promise(res=>{
    _pinResolve=res; _pinMode=mode; _pinStep=1; _pinFirst=''; _pinCur=''; _pinHash=hash||null;
    renderPin('',null);
    document.getElementById('pin-bg').classList.add('open');
  });
}
function closePin(val){
  document.getElementById('pin-bg').classList.remove('open');
  if(_pinResolve){_pinResolve(val);_pinResolve=null;}
}
function pinTitle(){
  if(_pinMode==='set')return _pinStep===1?'PIN 설정':'PIN 확인';
  if(_pinMode==='verify')return 'PIN 인증';
  return _pinStep===1?'현재 PIN 확인':'새 PIN 설정';
}
function pinSub(){
  if(_pinMode==='set')return _pinStep===1?'6자리 숫자 PIN을 설정하세요':'동일한 PIN을 다시 입력하세요';
  if(_pinMode==='verify')return '6자리 PIN을 입력하세요';
  return _pinStep===1?'현재 PIN을 입력하세요':'새 PIN을 입력하세요';
}
function renderPin(pin,err){
  document.getElementById('pin-box').innerHTML=`
    <div class="pin-icon">🔒</div>
    <div style="font-size:var(--f-lg);font-weight:700;color:var(--t1)">${pinTitle()}</div>
    <div style="font-size:var(--f-sm);color:var(--t2);margin-top:4px">${pinSub()}</div>
    <div class="pin-dots">${Array(6).fill(0).map((_,i)=>`<div class="pin-dot${i<pin.length?' on':''}"></div>`).join('')}</div>
    <div class="pin-err">${err||''}</div>
    <div class="pin-pad">
      ${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>
        k===''?'<div class="pk empty"></div>'
        :`<div class="pk" onclick="pinKey('${k}')">${k}</div>`).join('')}
    </div>
    <div class="pin-cancel" onclick="closePin(null)">취소</div>`;
  _pinCur=pin;
}
async function pinKey(k){
  if(k==='⌫'){renderPin(_pinCur.slice(0,-1),null);return;}
  if(_pinCur.length>=6)return;
  const pin=_pinCur+k;
  renderPin(pin,null);
  if(pin.length===6)await pinSubmit(pin);
}
async function pinSubmit(pin){
  if(_pinMode==='set'){
    if(_pinStep===1){_pinFirst=pin;_pinStep=2;renderPin('',null);}
    else{
      if(pin===_pinFirst)closePin(pin);
      else{_pinStep=1;_pinFirst='';renderPin('','PIN이 일치하지 않습니다.');}
    }
  }else if(_pinMode==='verify'){
    const h=await hashPin(pin);
    if(h===_pinHash)closePin(pin);
    else renderPin('','PIN이 올바르지 않습니다.');
  }else{
    if(_pinStep===1){
      const h=await hashPin(pin);
      if(h===_pinHash){_pinStep=2;renderPin('',null);}
      else renderPin('','현재 PIN이 올바르지 않습니다.');
    }else closePin(pin);
  }
}

/* ════════════════════════ KIS API ════════════════════════ */
async function kisToken(ak,as_){
  const exp=localStorage.getItem('kis_exp'),cached=localStorage.getItem('kis_tok');
  if(cached&&exp&&new Date(exp)>new Date(Date.now()+600000))return cached;
  let res;
  try{
    res=await fetch(`${KIS}/oauth2/tokenP`,{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({grant_type:'client_credentials',appkey:ak,appsecret:as_})});
  }catch(e){throw new Error('프록시 서버 연결 실패 — 화면 아래 ▶ 프록시 실행 버튼을 누르세요');}
  const txt=await res.text();
  let d;try{d=JSON.parse(txt);}catch(e){throw new Error('프록시 응답 오류 — kis_proxy.py 실행 여부 확인');}
  if(!res.ok)throw new Error('토큰 발급 실패: '+(d.message||txt.slice(0,60)));
  localStorage.setItem('kis_tok',d.access_token);
  localStorage.setItem('kis_exp',new Date(Date.now()+(d.expires_in||86400)*1000).toISOString());
  return d.access_token;
}
async function kisKrx(ak,as_,tok,ticker){
  // .KS / .KQ suffix 제거 → KIS API는 6자리 종목코드만 허용
  const isKq  = ticker.includes('.KQ');
  const code  = ticker.replace(/\.(KS|KQ)$/i, '');
  const mktDiv = isKq ? 'Q' : 'J';
  try{
    const r=await fetch(
      `${KIS}/uapi/domestic-stock/v1/quotations/inquire-price?FID_COND_MRKT_DIV_CODE=${mktDiv}&FID_INPUT_ISCD=${code}`,
      {headers:{authorization:`Bearer ${tok}`,appkey:ak,appsecret:as_,tr_id:'FHKST01010100','content-type':'application/json'}}
    );
    let d;try{d=await r.json();}catch(e){return null;}
    if(d.rt_cd==='0'){
      const p=parseFloat(d.output?.stck_prpr);
      if(p>0)return p;
    }
    // rt_cd가 0이 아니거나 가격이 0이면 반대 시장으로 재시도
    const fallback = isKq ? 'J' : 'Q';
    const r2=await fetch(
      `${KIS}/uapi/domestic-stock/v1/quotations/inquire-price?FID_COND_MRKT_DIV_CODE=${fallback}&FID_INPUT_ISCD=${code}`,
      {headers:{authorization:`Bearer ${tok}`,appkey:ak,appsecret:as_,tr_id:'FHKST01010100','content-type':'application/json'}}
    );
    let d2;try{d2=await r2.json();}catch(e){return null;}
    if(d2.rt_cd==='0'){const p=parseFloat(d2.output?.stck_prpr);if(p>0)return p;}
  }catch(e){}
  return null;
}
async function kisUs(ak,as_,tok,ticker){
  for(const ex of['NAS','NYS','AMS']){
    try{
      const r=await fetch(`${KIS}/uapi/overseas-price/v1/quotations/price?AUTH=&EXCD=${ex}&SYMB=${ticker}`,
        {headers:{authorization:`Bearer ${tok}`,appkey:ak,appsecret:as_,tr_id:'HHDFS00000300','content-type':'application/json'}});

/* ════════════════════════ 계산 ════════════════════════ */
// 시세가 모두 조회된 계좌인지 (하나라도 없으면 비중 계산이 틀어짐)
function accReady(acc){return acc.stocks.length>0&&acc.stocks.every(s=>s.loaded&&s.price>0);}
function missingTickers(acc){return acc.stocks.filter(s=>!(s.loaded&&s.price>0)).map(s=>s.name||s.ticker);}
// 매매 주수: 매수는 내림(예산 초과 방지), 매도는 반올림
function actQty(a){const sh=Math.abs(a.dSh);return a.dLocal<0?Math.round(sh):Math.floor(sh);}
// 체결 예상 금액(현지통화) = 주수 × 현재가
function actAmt(a){return actQty(a)*(a.st.price||0);}
// 유지 판정: 임계값 범위 안 / 금액 미미 / 0주
function isHold(a){return !!a.hold||Math.abs(a.dKrw)<1000||actQty(a)===0;}
function actionCellHtml(a,isKrx,sym,unit){
  if(!a||isHold(a)) return`<div style="font-size:var(--f-sm);color:var(--t3);font-weight:600">유지</div>`;
  const sell=a.dLocal<0;
  const ac=sell?'var(--sellc)':'var(--buy)';
  const amt=sym+fn(actAmt(a),isKrx?0:2)+unit;
  return`
    <div style="font-size:var(--f-sm);font-weight:700;color:${ac}">${sell?'매도':'매수'}</div>
    <div style="font-size:var(--f-sm);color:${ac};font-family:var(--mono)">${fn(actQty(a))}주</div>
    <div style="font-size:var(--f-sm);color:${ac};font-family:var(--mono);font-weight:600">${sell?'-':'+'}${amt}</div>`;
}
function accVal(acc){return acc.stocks.reduce((s,st)=>s+(st.quantity||0)*(st.price||0),0);}
function accKrw(acc){const v=accVal(acc);return acc.market==='KRX'?v:v*S.rate;}
function stW(acc,st){
  const t=accKrw(acc);if(!t)return 0;
  const v=acc.market==='KRX'?(st.quantity||0)*(st.price||0):(st.quantity||0)*(st.price||0)*S.rate;
  return v/t*100;
}
function devCnt(acc){
  return acc.stocks.filter(st=>st.loaded&&Math.abs(stW(acc,st)-st.tgt)>(acc.thr||5)).length;
}
function devDetail(acc){
  // 초과(over): 현재비중 > 목표비중+임계값
  // 부족(under): 현재비중 < 목표비중-임계값
  let over=0,under=0,unloaded=0;
  acc.stocks.forEach(st=>{
    if(!st.loaded){unloaded++;return;}
    const diff=stW(acc,st)-st.tgt;
    if(diff>(acc.thr||5)) over++;
    else if(diff<-(acc.thr||5)) under++;
  });
  return{over,under,unloaded};
}
function rebActions(acc){
  const tk=accKrw(acc);
  return acc.stocks.map(st=>{
    const cw=stW(acc,st),diff=st.tgt-cw;
    const dKrw=tk*diff/100;
    const dLocal=acc.market==='KRX'?dKrw:dKrw/S.rate;
    const dSh=st.price>0?dLocal/st.price:0;
    const hold=Math.abs(diff)<=(acc.thr||5);
    return{st,cw,tw:st.tgt,dKrw,dLocal,dSh,hold};
  }).sort((a,b)=>Math.abs(b.dKrw)-Math.abs(a.dKrw));
}
function rebActionsWithBudget(acc, budgetKrw){
  // 총투자금액 기준: 각 종목 목표금액 = budget * tgt/100, 현재보유금액 차감 → 매수/매도
  const isKrx=acc.market==='KRX';
  return acc.stocks.map(st=>{
    const tgtKrw=budgetKrw*(st.tgt/100);
    const curKrw=isKrx?(st.quantity||0)*(st.price||0):(st.quantity||0)*(st.price||0)*S.rate;
    const dKrw=tgtKrw-curKrw;
    const dLocal=isKrx?dKrw:dKrw/S.rate;
    const dSh=st.price>0?dLocal/st.price:0;
    const cw=budgetKrw>0?curKrw/budgetKrw*100:0;
    return{st,cw,tw:st.tgt,dKrw,dLocal,dSh};
  }).sort((a,b)=>Math.abs(b.dKrw)-Math.abs(a.dKrw));
}
function fn(n,d=0){return n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function ft(iso){
  if(!iso)return '-';
  const d=new Date(iso);
  return`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

    const clip=document.createElementNS(NS,'clipPath');
    clip.setAttribute('id','donut-clip-'+i);
    const clipCircle=document.createElementNS(NS,'circle');
    clipCircle.setAttribute('cx',cx);clipCircle.setAttribute('cy',cy);clipCircle.setAttribute('r',r+1);
    clip.appendChild(clipCircle);defs.appendChild(clip);svg.appendChild(defs);
    // 슬라이스 그룹
    const g=document.createElementNS(NS,'g');
    g.setAttribute('clip-path','url(#donut-clip-'+i+')');
    let ang=-Math.PI/2, hasSlice=false;
    acc.stocks.forEach((st)=>{
      const curW=anyLoaded?stW(acc,st):st.tgt;
      if(curW<=0)return;
      hasSlice=true;
      const col=stockBaseColor(acc,st);
      const sw=curW/100*2*Math.PI;
      const end=ang+sw, lg=sw>Math.PI?1:0;
      const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
      const x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
      const ix1=cx+ir*Math.cos(ang), iy1=cy+ir*Math.sin(ang);
      const ix2=cx+ir*Math.cos(end), iy2=cy+ir*Math.sin(end);
      const path=document.createElementNS(NS,'path');
      path.setAttribute('d',`M${ix1.toFixed(1)},${iy1.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${ix2.toFixed(1)},${iy2.toFixed(1)} A${ir},${ir} 0 ${lg},0 ${ix1.toFixed(1)},${iy1.toFixed(1)} Z`);
      path.setAttribute('fill',col);
      path.setAttribute('stroke',bgCol);
      path.setAttribute('stroke-width','1.2');
      g.appendChild(path);
      ang=end;
    });
    if(!hasSlice){
      const bg=document.createElementNS(NS,'circle');
      bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',r);bg.setAttribute('fill','#2a3a4a');
      g.appendChild(bg);
    }
    svg.appendChild(g);
    // 도넛 구멍
    const hole=document.createElementNS(NS,'circle');
    hole.setAttribute('cx',cx);hole.setAttribute('cy',cy);hole.setAttribute('r',ir);hole.setAttribute('fill',bgCol);
    svg.appendChild(hole);
    // 중앙 텍스트
    const txt1=document.createElementNS(NS,'text');
    txt1.setAttribute('x',50);txt1.setAttribute('y',46);txt1.setAttribute('text-anchor','middle');
    txt1.setAttribute('fill',t1Col);txt1.setAttribute('font-size','10');
    txt1.setAttribute('font-family','DM Mono');txt1.setAttribute('font-weight','700');
    txt1.textContent=acc.stocks.length;
    const txt2=document.createElementNS(NS,'text');
    txt2.setAttribute('x',50);txt2.setAttribute('y',57);txt2.setAttribute('text-anchor','middle');
    txt2.setAttribute('fill',t3Col);txt2.setAttribute('font-size','6.5');
    txt2.setAttribute('font-family','DM Mono');
    txt2.textContent='종목';
    svg.appendChild(txt1);svg.appendChild(txt2);
  });
}

/* ════════════════════════ 계좌 상세 ════════════════════════ */
function openDetail(idx){
  S.detailIdx=idx;
  renderDetailContent(idx);
  const panel=document.getElementById('detail-panel');
  // edit/del 버튼 이벤트
  document.getElementById('detail-edit-btn').onclick=()=>openAccSheet(idx);
  document.getElementById('detail-del-btn').onclick=()=>delAcc(idx);
  panel.classList.add('open');
  // 스크롤 초기화
  document.getElementById('detail-content').scrollTop=0;
}
function closeDetail(){
  document.getElementById('detail-panel').classList.remove('open');
  render();
}
function renderDetailContent(idx){
  const acc=S.accounts[idx];
  const color=AC[acc.ci%5];
  const v=accVal(acc),vk=accKrw(acc);
  const tw=acc.stocks.reduce((s,st)=>s+st.tgt,0);
  const priceLoaded=acc.stocks.some(s=>s.loaded);
  const thr=acc.thr||5;
  const isKrx=acc.market==='KRX';
  const sym=isKrx?'':'$', unit=isKrx?'원':'';
  document.getElementById('detail-title').textContent=acc.name;

  // ── budget 상태 ──────────────────────────────────
  const db=S.detailBudget;
  const budgetKrw=db.val?parseFloat(db.val.replace(/,/g,'')):0;
  const useBudget=db.mode&&budgetKrw>0;
  // 리밸런싱 기준 총액: budget 모드면 입력금액, 아니면 현재 평가금액
  const totalKrw=useBudget?budgetKrw:accKrw(acc);
  // 종목별 budget 액션 맵 (ticker → action)
  const ready=accReady(acc);
  const budgetActions=ready?(useBudget?rebActionsWithBudget(acc,budgetKrw):rebActions(acc)):[];
  const actionMap={};
  budgetActions.forEach(a=>{ actionMap[a.st.ticker]=a; });

  let h=`
  <div class="detail-header" style="background:linear-gradient(135deg,${color}1F,var(--s1) 65%);border:1px solid ${color}40">
    <div style="font-size:var(--f-xs);color:var(--t2)">${acc.broker} · ${acc.market}</div>
    <div style="font-family:var(--mono);font-size:var(--f-2xl);font-weight:500;margin:4px 0">${acc.market==='KRX'?fn(v)+'원':'$'+fn(v,2)}</div>
    ${acc.market==='US'&&vk?`<div style="font-size:var(--f-xs);color:var(--t2)">≈ ${fn(vk)}원</div>`:''}
    ${acc.memo?`<div style="font-size:var(--f-xs);color:var(--t3);margin-top:5px">${acc.memo}</div>`:''}
  </div>`;

  if(acc.stocks.some(s=>s.loaded)&&!accReady(acc))
    h+=`<div class="alert alert-warn" style="margin:4px 12px">시세 미조회: ${missingTickers(acc).join(', ')} — 리밸런싱 계산을 멈췄습니다</div>`;
  if(tw!==100&&acc.stocks.length)
    h+=`<div class="alert alert-warn" style="margin:4px 12px">목표 비중 합계 ${tw.toFixed(1)}% (${tw>100?'초과':'부족'} ${Math.abs(100-tw).toFixed(1)}%)</div>`;

  // ── 총투자금액 리밸런싱 패널 (종목 목록 위) ──────
  if(priceLoaded){
    const buyT=budgetActions.filter(a=>!isHold(a)&&a.dLocal>0).reduce((s,a)=>s+actAmt(a),0);
    const selT=budgetActions.filter(a=>!isHold(a)&&a.dLocal<0).reduce((s,a)=>s+actAmt(a),0);
    const adjN=budgetActions.filter(a=>!isHold(a)).length;
    h+=`<div style="margin:8px 12px;border:1px solid var(--bd);border-radius:12px;overflow:hidden">
      <!-- 토글 헤더 -->
      <div style="display:flex;align-items:center;padding:10px 14px;background:var(--s1);gap:10px;cursor:pointer"
        onclick="S.detailBudget.mode=!S.detailBudget.mode;renderDetailContent(${idx})">
        <span style="font-size:15px">💰</span>
        <span style="font-size:var(--f-sm);font-weight:600;flex:1">총투자금액으로 리밸런싱</span>
        <span style="font-size:15px;color:var(--accent);font-weight:700">${db.mode?'▲':'▼'}</span>
      </div>
      ${db.mode?`
      <div style="padding:12px 14px;border-top:1px solid var(--bd);background:var(--bg)">
        <div style="font-size:var(--f-xs);color:var(--t3);margin-bottom:6px">
          현재 평가금액: <b style="color:var(--t1)">${isKrx?fn(accVal(acc))+'원':'$'+fn(accVal(acc),2)}</b>
          ${!isKrx?`<span style="color:var(--t3)"> ≈ ${fn(accKrw(acc))}원</span>`:''}
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="flex:1;display:flex;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:0 12px;gap:6px">
            <span style="font-size:var(--f-sm);color:var(--t3)">${isKrx?'₩':'$'}</span>
            <input id="detail-budget-input" type="text" inputmode="numeric"
              value="${db.val}"
              placeholder="${isKrx?'예: 10,000,000':'예: 10,000'}"
              style="flex:1;background:none;border:none;outline:none;font-size:var(--f-md);font-family:var(--mono);color:var(--t1);padding:10px 0"
              oninput="S.detailBudget.val=this.value;renderDetailBudgetResult(${idx})"
            />
          </div>
          <button onclick="S.detailBudget.val='';renderDetailContent(${idx})"
            style="padding:10px 14px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--t2);font-size:var(--f-sm);cursor:pointer">초기화</button>
        </div>
        ${budgetKrw>0?`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span style="font-size:var(--f-xs);color:var(--t3)">목표총액:</span>
          <span style="font-size:var(--f-xs);font-family:var(--mono);color:var(--accent);font-weight:600">${isKrx?fn(budgetKrw)+'원':'$'+fn(budgetKrw/S.rate,2)}</span>
          <span style="font-size:var(--f-xs);color:${budgetKrw>accKrw(acc)?'var(--buy)':'var(--sell)'}">
            　${budgetKrw>accKrw(acc)?'▲ 추가투자 ':'▼ 일부회수 '}${isKrx?fn(Math.abs(budgetKrw-accKrw(acc)))+'원':'$'+fn(Math.abs(budgetKrw-accKrw(acc))/S.rate,2)}
          </span>
        </div>`:''}
        <!-- 요약 -->
        <div id="detail-budget-summary" class="reb-summary" style="margin:10px 0 0;border-radius:8px;border:1px solid var(--bd)">
          <div class="reb-cell"><div class="reb-cl">총 매수</div><div class="reb-cv" style="color:var(--buy)">${sym}${fn(buyT,isKrx?0:2)}${unit}</div></div>
          <div class="reb-cell"><div class="reb-cl">총 매도</div><div class="reb-cv" style="color:var(--sellc)">${sym}${fn(selT,isKrx?0:2)}${unit}</div></div>
          <div class="reb-cell"><div class="reb-cl">조정</div><div class="reb-cv" style="color:var(--accent)">${adjN}종목</div></div>
        </div>
      </div>`:''}
    </div>`;
  }

  // ── 헤더 행 ──────────────────────────────────────
  h+=`<div style="display:flex;align-items:center;padding:10px 14px 4px;gap:4px">
    <span style="font-size:var(--f-sm);color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600">종목 목록</span>
    <div style="flex:1"></div>
    <button onclick="openColSheet()" style="font-size:var(--f-xs);padding:2px 10px;border-radius:10px;
      background:var(--s2);border:1px solid var(--bd);color:var(--t2);cursor:pointer;margin-right:6px">⚙ 컬럼</button>
    <span style="font-size:var(--f-sm);color:var(--t3);font-weight:500">임계값 ±${thr}%</span>
  </div>`;

  // ── 컬럼 헤더 ────────────────────────────────────
  const sd=S.sortDetail;
  const dc=S.detailCols;
  function sdArrow(k){return sd.key===k?(sd.asc?'▲':'▼'):'⇅';}
  const colDefs=[
    {key:'price',    label:'현재가',   sort:'val'},
    {key:'avgPrice', label:'매입가',   sort:'avg'},
    {key:'profitRate',label:'수익률',  sort:'pl'},
    {key:'costVal',  label:'매입금액', sort:'cost'},
    {key:'evalVal',  label:'평가금액', sort:'eval'},
    {key:'holdPct',  label:'보유비중', sort:'hold'},
    {key:'qty',      label:'보유수량', sort:'qty'},
  ];
  const activeCols=colDefs.filter(c=>dc[c.key]);
  h+=`<div class="dt-wrap"><div class="dt-row dt-head" style="display:flex;align-items:center;padding:5px 14px 7px;gap:8px;border-bottom:1px solid var(--bd)">
    <div class="dt-name" style="flex:1.2;font-size:var(--f-sm);color:var(--t2);font-weight:600;cursor:pointer;user-select:none;min-width:80px" onclick="setDetailSort('name')">종목 ${sdArrow('name')}</div>
    ${activeCols.map(c=>`
      <div class="dt-num" style="flex:1;text-align:right;font-size:var(--f-xs);color:var(--t2);font-weight:500;cursor:pointer;user-select:none;min-width:60px;white-space:nowrap"
        onclick="setDetailSort('${c.sort}')">${c.label} ${sdArrow(c.sort)}</div>`).join('')}
    <div class="dt-reb" style="flex:1;text-align:right;font-size:var(--f-xs);color:var(--t2);font-weight:500;min-width:60px">리밸런싱</div>
    <div class="dt-bar" style="flex:1.2;font-size:var(--f-xs);color:var(--t2);font-weight:500;min-width:100px;cursor:pointer;white-space:nowrap" onclick="setDetailSort('tgt')">
      <span style="color:color-mix(in srgb,var(--accent) 70%,var(--t3))">■</span> 목표 ${sdArrow('tgt')}
      <span style="margin-left:6px;cursor:pointer" onclick="event.stopPropagation();setDetailSort('cur')">■ 현재 ${sdArrow('cur')}</span>
    </div>
  </div>`;

  if(!acc.stocks.length){
    h+=`<div class="empty" style="padding:40px 20px"><div class="ei">📈</div><p>종목을 추가하세요</p></div>`;
  } else {
    const maxPct=Math.max(...acc.stocks.flatMap(st=>[st.tgt,priceLoaded?stW(acc,st):st.tgt]),1);
    const sortedStocks=[...acc.stocks.map((st,si)=>({st,si}))].sort((a,b)=>{
      let va,vb;
      if(sd.key==='name'){va=a.st.name||a.st.ticker;vb=b.st.name||b.st.ticker;return sd.asc?va.localeCompare(vb):vb.localeCompare(va);}
      if(sd.key==='tgt'){va=a.st.tgt;vb=b.st.tgt;}
      if(sd.key==='cur'){va=priceLoaded?stW(acc,a.st):a.st.tgt;vb=priceLoaded?stW(acc,b.st):b.st.tgt;}
      if(sd.key==='val'||sd.key==='cost'){va=(a.st.quantity||0)*(a.st.avgPrice||0);vb=(b.st.quantity||0)*(b.st.avgPrice||0);}
      if(sd.key==='eval'){va=(a.st.quantity||0)*(a.st.price||0);vb=(b.st.quantity||0)*(b.st.price||0);}
      if(sd.key==='avg'){va=a.st.avgPrice||0;vb=b.st.avgPrice||0;}
      if(sd.key==='pl'){
        const ca=(a.st.quantity||0)*(a.st.avgPrice||0),ea=(a.st.quantity||0)*(a.st.price||0);
        const cb=(b.st.quantity||0)*(b.st.avgPrice||0),eb=(b.st.quantity||0)*(b.st.price||0);
        // 미조회 종목은 정렬 시 항상 맨 아래
        const NA=sd.asc?Infinity:-Infinity;
        va=a.st.loaded&&ca>0?(ea-ca)/ca*100:NA;vb=b.st.loaded&&cb>0?(eb-cb)/cb*100:NA;
        if(va===vb)return 0;
      }
      if(sd.key==='hold'){va=stW(acc,a.st);vb=stW(acc,b.st);}
      if(sd.key==='qty'){va=a.st.quantity||0;vb=b.st.quantity||0;}
      return sd.asc?va-vb:vb-va;
    });

    sortedStocks.forEach(({st,si})=>{
      const cw=priceLoaded?stW(acc,st):0;
      const diff=cw-st.tgt;
      const isOver=diff>thr, isUnder=diff<-thr;
      const isLoaded=st.loaded;
      const curColor=!isLoaded?'var(--t3)':isOver?'var(--sell)':isUnder?'var(--warn)':'var(--buy)';
      const tgtColor='color-mix(in srgb,var(--accent) 55%,transparent)';
      const tgtBorder='var(--accent)';
      const BAR=180;
      const tgtW_px=(st.tgt/maxPct*BAR).toFixed(1);
      const curW_px=isLoaded?Math.max((cw/maxPct*BAR),0).toFixed(1):'0';

      // ── 리밸런싱 계산 (budget 연동) ──────────────
      let actionHtml='';
      if(ready&&isLoaded&&totalKrw>0){
        actionHtml=actionCellHtml(actionMap[st.ticker],isKrx,sym,unit);
      } else if(isLoaded){
        actionHtml=`<div style="font-size:var(--f-sm);color:var(--t3)">대기</div>`;
      } else if(!isLoaded){
        actionHtml=`<div style="font-size:var(--f-sm);color:var(--t3)">-</div>`;
      }

      const priceColor=st.avgPrice>0&&st.loaded
        ?(st.price>st.avgPrice?'var(--buy)':st.price<st.avgPrice?'#4A9EFF':'var(--t1)')
        :'var(--t1)';
      const priceStr=st.loaded?(isKrx?fn(st.price)+'원':'$'+fn(st.price,2)):'미조회';
      const avgStr=st.avgPrice>0?(isKrx?fn(st.avgPrice)+'원':'$'+fn(st.avgPrice,2)):'-';
      const costVal=(st.quantity||0)*(st.avgPrice||0);
      const evalVal=(st.quantity||0)*(st.price||0);
      const evalKrw=isKrx?evalVal:evalVal*S.rate;
      const costKrw=isKrx?costVal:costVal*S.rate;
      const plKrw=evalKrw-costKrw;
      // 시세 미조회면 평가액을 알 수 없으므로 손익 계산 안 함 (-100% 오표시 방지)
      const plPct=st.loaded&&st.price>0&&costKrw>0?plKrw/costKrw*100:null;
      const plColor=plKrw>0?'var(--buy)':plKrw<0?'var(--sell)':'var(--t3)';
      const evalStr=st.loaded?(isKrx?fn(Math.round(evalVal))+'원':'$'+fn(evalVal,2)):'-';
      const costStr=costVal>0?(isKrx?fn(Math.round(costVal))+'원':'$'+fn(costVal,2)):'-';
      const plStr=plPct!==null&&costVal>0
        ?`<span style="color:${plColor}">${plKrw>=0?'+':''}${plPct.toFixed(1)}%</span>`
        :`<span style="color:var(--t3)">-</span>`;
      const holdPct=totalKrw>0?(isKrx?evalVal/totalKrw*100:evalKrw/totalKrw*100):0;
      const holdStr=st.loaded?holdPct.toFixed(1)+'%':'-';

      h+=`<div class="dt-row" style="display:flex;align-items:center;padding:13px 14px;gap:8px;border-bottom:1px solid var(--bd)">
        <!-- 종목명 -->
        <div class="dt-name" style="flex:1.2;min-width:80px">
          <div style="font-size:var(--f-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${st.name}</div>
          <div style="font-size:var(--f-xs);color:var(--t2);font-family:var(--mono)">${st.ticker}</div>
          <div style="display:flex;gap:4px;margin-top:4px">
            <div class="act-btn" style="color:var(--accent)" onclick="openStockSheet(${idx},${si})">✎</div>
            <div class="act-btn" style="color:var(--sell)"   onclick="delSt(${idx},${si})">✕</div>
          </div>
        </div>
        <!-- 동적 컬럼 -->
        ${activeCols.map(c=>{
          let content='';
          if(c.key==='price')    content=`<div style="font-family:var(--mono);font-size:var(--f-xs);font-weight:600;color:${priceColor}">${priceStr}</div>`;
          if(c.key==='avgPrice') content=`<div style="font-family:var(--mono);font-size:var(--f-xs);color:var(--t2)">${avgStr}</div>`;
          if(c.key==='profitRate')content=`<div style="font-size:var(--f-sm);font-weight:700">${plStr}</div>${plPct!==null&&costVal>0?`<div style="font-size:15px;color:${plColor};font-family:var(--mono)">${plKrw>=0?'+':''}${fn(Math.round(plKrw))}원</div>`:''}`;
          if(c.key==='costVal')  content=`<div style="font-family:var(--mono);font-size:var(--f-xs);color:var(--t2)">${costStr}</div>`;
          if(c.key==='evalVal')  content=`<div style="font-family:var(--mono);font-size:var(--f-xs);font-weight:600;color:var(--t1)">${evalStr}</div>`;
          if(c.key==='holdPct')  content=`<div style="font-family:var(--mono);font-size:var(--f-sm);font-weight:600;color:var(--accent)">${holdStr}</div>`;
          if(c.key==='qty')      content=`<div style="font-family:var(--mono);font-size:var(--f-sm);font-weight:600;color:var(--t1)">${fn(st.quantity||0)}주</div>`;
          return`<div class="dt-num" style="flex:1;text-align:right;min-width:60px">${content}</div>`;
        }).join('')}
        <!-- 리밸런싱 -->
        <div id="reb-cell-${st.ticker.replace(/\./g,'_')}" class="dt-reb" style="flex:1;text-align:right;min-width:60px">${actionHtml}</div>
        <!-- 비중 바 -->
        <div class="dt-bar" style="flex:1.2;min-width:100px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <div style="flex:1;height:13px;background:var(--s2);border-radius:3px;overflow:hidden">
              <div style="width:${st.tgt}%;height:100%;background:${tgtColor};border:1px solid ${tgtBorder};border-radius:3px;box-sizing:border-box"></div>
            </div>
            <span style="width:44px;text-align:right;font-size:var(--f-sm);color:var(--accent);font-family:var(--mono);font-weight:600">${st.tgt}%</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:13px;background:var(--s2);border-radius:3px;overflow:hidden">
              ${isLoaded
                ?`<div style="width:${Math.min(cw,100)}%;height:100%;background:${curColor};border-radius:3px;transition:width .4s ease"></div>`
                :`<div style="width:100%;height:100%;background:repeating-linear-gradient(90deg,var(--s3) 0,var(--s3) 4px,transparent 4px,transparent 8px)"></div>`}
            </div>
            <span style="width:44px;text-align:right;font-size:var(--f-sm);color:${curColor};font-family:var(--mono);font-weight:600">${isLoaded?cw.toFixed(1)+'%':'?'}</span>
          </div>
          ${isLoaded?`<div style="text-align:right;margin-top:2px">

      <div style="font-size:var(--f-xs);color:var(--t2)">증권사 앱에서 직접 매매하세요</div></div>

function updateRebResult(){
  const wrap=document.getElementById('reb-result-wrap');
  if(!wrap)return;
  const acc=S.accounts[S.selAcc];
  const isKrx=acc.market==='KRX';
  const sym=isKrx?'':'$',unit=isKrx?'원':'';
  const budgetKrw=S.budgetVal?parseFloat(S.budgetVal.replace(/,/g,'')):0;
  const dispActions=S.budgetMode&&budgetKrw>0?rebActionsWithBudget(acc,budgetKrw):rebActions(acc);
  const buyT=dispActions.filter(a=>!isHold(a)&&a.dLocal>0).reduce((s,a)=>s+actAmt(a),0);
  const selT=dispActions.filter(a=>!isHold(a)&&a.dLocal<0).reduce((s,a)=>s+actAmt(a),0);
  const adjN=dispActions.filter(a=>!isHold(a)).length;
  let r=`<div class="reb-summary">
    <div class="reb-cell"><div class="reb-cl">총 매수</div><div class="reb-cv" style="color:var(--buy)">${sym}${fn(buyT,isKrx?0:2)}${unit}</div></div>
    <div class="reb-cell"><div class="reb-cl">총 매도</div><div class="reb-cv" style="color:var(--sellc)">${sym}${fn(selT,isKrx?0:2)}${unit}</div></div>
    <div class="reb-cell"><div class="reb-cl">조정</div><div class="reb-cv" style="color:var(--accent)">${adjN}종목</div></div>
  </div>
  <div class="row" style="padding:10px 14px 4px;gap:6px;flex-wrap:wrap">
    <span class="sec-lbl" style="padding:0">리밸런싱 내역${S.budgetMode&&budgetKrw>0?' (목표금액 기준)':''}</span>
    <div class="spacer"></div>
    ${(['name','tgt','val']).map(k=>{
      const labels={name:'종목명',tgt:'비중',val:'매입금액'};
      const active=S.sortReb.key===k;
      const arrow=active?(S.sortReb.asc?'▲':'▼'):'';
      return`<button onclick="setRebSort('${k}')" style="padding:3px 10px;border-radius:12px;font-size:var(--f-xs);cursor:pointer;font-family:var(--sans);
        background:${active?'color-mix(in srgb,var(--accent) 15%,transparent)':'var(--s2)'};
        border:1px solid ${active?'var(--accent)':'var(--bd)'};
        color:${active?'var(--accent)':'var(--t2)'};font-weight:${active?700:500}">${labels[k]} ${arrow}</button>`;
    }).join('')}
    <span style="font-size:17px;color:var(--t3);align-self:center">임계값 ±${acc.thr||5}%</span>
  </div>`;

  // 정렬 적용
  const sr=S.sortReb;
  const sortedActions=[...dispActions].sort((a,b)=>{
    if(sr.key==='name'){const va=a.st.name||a.st.ticker,vb=b.st.name||b.st.ticker;return sr.asc?va.localeCompare(vb):vb.localeCompare(va);}
    if(sr.key==='tgt'){return sr.asc?a.tw-b.tw:b.tw-a.tw;}
    if(sr.key==='val'){return sr.asc?Math.abs(a.dLocal)-Math.abs(b.dLocal):Math.abs(b.dLocal)-Math.abs(a.dLocal);}
    return 0;
  });

  r+=sortedActions.map(a=>{
    const flat=isHold(a);
    const buy=a.dLocal>0;
    const ac=flat?'var(--t3)':buy?'var(--buy)':'var(--sellc)';
    const amt=sym+fn(actAmt(a),isKrx?0:2)+unit;
    return`<div class="action-card">
      <div class="ab ${flat?'ab-hold':buy?'ab-buy':'ab-sell'}">
        <span class="ab-icon">${flat?'✓':buy?'↑':'↓'}</span>
        <span class="ab-lbl">${flat?'유지':buy?'매수':'매도'}</span>
      </div>
      <div style="flex:1">
        <div style="font-size:var(--f-md);font-weight:600">${a.st.name}</div>
        <div style="font-size:var(--f-xs);color:var(--t2);font-family:var(--mono)">${a.st.ticker}</div>
      </div>
      <div style="text-align:right">
        ${flat
          ?`<div style="color:var(--t3);font-size:var(--f-xs)">${a.hold?'임계값 범위 내':'비중 근접'}</div><div style="font-size:var(--f-xs);color:var(--t3);font-family:var(--mono)">${a.cw.toFixed(1)}% ≈ ${a.tw.toFixed(1)}%</div>`
          :`<div style="font-family:var(--mono);font-size:var(--f-md);font-weight:600;color:${ac}">${buy?'+':'-'}${amt}</div>
           <div style="font-size:var(--f-sm);color:${ac};font-family:var(--mono)">${fn(actQty(a))}주</div>
           <div style="font-size:var(--f-sm);color:var(--t2);font-family:var(--mono)">${a.cw.toFixed(1)}% → ${a.tw.toFixed(1)}%</div>`}
      </div>
    </div>`;
  }).join('');
  wrap.innerHTML=r;
}

/* ════════════════════════ 자산 스냅샷 ════════════════════════ */
function localDate(d=new Date()){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function saveSnapshot(){
  const today=localDate();
  let hist={};
  try{hist=JSON.parse(localStorage.getItem('rb2_history')||'{}');}catch(e){}
  const snap={total:S.accounts.reduce((s,a)=>s+accKrw(a),0),rate:S.rate,accounts:{}};
  S.accounts.forEach(a=>{snap.accounts[a.name]={value:accKrw(a),market:a.market};});
  hist[today]=snap;
  // 최대 730일(2년) 보관
  const keys=Object.keys(hist).sort();
  while(keys.length>730){delete hist[keys.shift()];}
  localStorage.setItem('rb2_history',JSON.stringify(hist));
  cloudMarkDirty();
}

function getHistory(){
  try{return JSON.parse(localStorage.getItem('rb2_history')||'{}');}catch(e){return{};}
}

function addManualSnapshot(){
  // 수동 스냅샷: 시세 미조회 상태에서도 현재 수량×가격으로 저장
  if(!S.accounts.length){alert('계좌가 없습니다');return;}
  saveSnapshot();
  renderChart();
  alert('오늘 자산이 기록되었습니다');
}

/* ════════════════════════ 차트: 자산 추이 ════════════════════════ */
function renderChart(){

  const hist=getHistory();
  const allKeys=Object.keys(hist).sort();

  // 기간 필터
  const rangeDays={  '7d':7,'30d':30,'90d':90,'1y':365,'all':9999};
  const days=rangeDays[S.chartRange]||30;
  const cutoff=days<9999
    ? localDate(new Date(Date.now()-days*86400000))
    : '0000-00-00';
  const keys=allKeys.filter(k=>k>=cutoff);

  // 계좌 필터 목록
  const accNames=['all',...new Set(allKeys.flatMap(k=>Object.keys(hist[k].accounts||{})))];

    const px=(i)=>PL+i/(series.length-1)*IW;

    const pts=series.map((d,i)=>`${px(i).toFixed(1)},${py(d.val).toFixed(1)}`).join(' ');

function renderDetailBudgetResult(idx){
  const acc=S.accounts[idx];
  const db=S.detailBudget;
  const budgetKrw=db.val?parseFloat(db.val.replace(/,/g,'')):0;
  const isKrx=acc.market==='KRX';
  const sym=isKrx?'':'$', unit=isKrx?'원':'';
  const useBudget=db.mode&&budgetKrw>0;
  const totalKrw=useBudget?budgetKrw:accKrw(acc);
  if(!accReady(acc))return;
  const dispActions=useBudget?rebActionsWithBudget(acc,budgetKrw):rebActions(acc);
  const actionMap={};
  dispActions.forEach(a=>{actionMap[a.st.ticker]=a;});

  // 요약 갱신
  const summary=document.getElementById('detail-budget-summary');
  if(summary){
    const buyT=dispActions.filter(a=>!isHold(a)&&a.dLocal>0).reduce((s,a)=>s+actAmt(a),0);
    const selT=dispActions.filter(a=>!isHold(a)&&a.dLocal<0).reduce((s,a)=>s+actAmt(a),0);
    const adjN=dispActions.filter(a=>!isHold(a)).length;
    summary.innerHTML=`
      <div class="reb-cell"><div class="reb-cl">총 매수</div><div class="reb-cv" style="color:var(--buy)">${sym}${fn(buyT,isKrx?0:2)}${unit}</div></div>
      <div class="reb-cell"><div class="reb-cl">총 매도</div><div class="reb-cv" style="color:var(--sellc)">${sym}${fn(selT,isKrx?0:2)}${unit}</div></div>
      <div class="reb-cell"><div class="reb-cl">조정</div><div class="reb-cv" style="color:var(--accent)">${adjN}종목</div></div>`;
  }

  // 종목별 리밸런싱 셀 갱신
  acc.stocks.forEach(st=>{
    const cellId='reb-cell-'+st.ticker.replace(/\./g,'_');
    const cell=document.getElementById(cellId);
    if(!cell||!st.loaded)return;
    const a=actionMap[st.ticker];
    const actionHtml=actionCellHtml(a,isKrx,sym,unit);
    cell.innerHTML=actionHtml;
  });
}

function exportData(){
  const data={
    version:2,
    exportedAt: new Date().toISOString(),
    accounts: JSON.parse(JSON.stringify(S.accounts)),  // 깊은 복사
    rate: S.rate,
  };
  // 주가 데이터(price,loaded)는 제외 — 어차피 시세 갱신으로 다시 가져옴
  data.accounts.forEach(acc=>{
    acc.stocks.forEach(st=>{
      delete st.price;
      delete st.loaded;
    });
  });
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = localDate();
  a.href = url;
  a.download = `rebalancer_backup_${date}.json`;
  a.click();

  if(el)el.innerHTML=`<div class="test-result tr-ok">✅ ${S.accounts.length}개 계좌, ${S.accounts.reduce((s,a)=>s+a.stocks.length,0)}개 종목 내보내기 완료</div>`;

async function importData(input){
  const file = input.files[0];
  if(!file) return;
  const el=document.getElementById('backup-status');
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    // 버전/형식 검증
    if(!data.accounts || !Array.isArray(data.accounts)){
      throw new Error('올바른 백업 파일이 아닙니다');
    }
    // 기존 데이터가 있으면 병합/덮어쓰기 선택
    if(S.accounts.length > 0){
      const choice = await confirmImport(data.accounts.length);
      if(choice === null){ input.value=''; return; }  // 취소
      if(choice === 'overwrite'){
        S.accounts = restoreAccounts(data.accounts);
      } else {
        // 병합: 이름이 같은 계좌는 건너뜀
        const existing = new Set(S.accounts.map(a=>a.name));
        const merged = restoreAccounts(data.accounts).filter(a=>!existing.has(a.name));
        S.accounts.push(...merged);
        const skipped = data.accounts.length - merged.length;
        if(el) el.innerHTML=`<div class="test-result tr-ok">✅ ${merged.length}개 계좌 추가${skipped>0?` (${skipped}개 중복 건너뜀)`:''}</div>`;
        save(); render(); input.value=''; return;
      }
    } else {
      S.accounts = restoreAccounts(data.accounts);
    }
    if(data.rate) S.rate = data.rate;
    save(); render();
    const total = S.accounts.reduce((s,a)=>s+a.stocks.length,0);
    if(el) el.innerHTML=`<div class="test-result tr-ok">✅ ${S.accounts.length}개 계좌, ${total}개 종목 복원 완료</div>`;
  } catch(e){
    if(el) el.innerHTML=`<div class="test-result tr-fail">❌ 가져오기 실패: ${e.message}</div>`;
  }
  input.value='';
}

function restoreAccounts(accounts){
  sanitizeAccounts(accounts);
  // id 재생성, price/loaded 초기화
  let _uid=Date.now();
  const uid=()=>(++_uid).toString(36)+Math.random().toString(36).slice(2,4);
  return accounts.map(acc=>({
    ...acc,
    id: uid(),
    ci: acc.ci ?? acc.colorIndex ?? 0,
    thr: acc.thr ?? acc.threshold ?? 5,
    stocks: (acc.stocks||[]).map(st=>({
      ...st,
      id: uid(),
      tgt: st.tgt ?? st.targetWeight ?? 0,
      quantity: st.quantity ?? 0,
      price: 0,
      loaded: false,
    }))
  }));
}

// 앱·프록시 버전은 앞 두 자리(2.3)만 맞으면 호환 — 앱만 고친 패치(2.3.x)에 프록시 재빌드 불필요
// 버전 a 가 b 이상인지 (예: verGte('2.3.0','2.3.0') → true)
function verGte(a, b) {
  if (!a) return false;
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
  return true;
}

// 연결 실패 원인 구분
//  'old'     : 프록시는 떠 있는데 이 주소를 허용하지 않음 (구버전 프록시)
//  'blocked' : 크롬이 로컬 네트워크 접근을 차단함
//  'off'     : 프록시가 꺼져 있음
async function diagnoseProxy() {
  try {
    // no-cors 요청은 CORS 허용 여부와 상관없이, 서버가 응답하기만 하면 성공
    await fetch(`${KIS}/health`, { mode: 'no-cors', signal: AbortSignal.timeout(1500) });
    return 'old';
  } catch (e) { /* 서버 응답 없음 또는 브라우저 차단 */ }
  try {
    const p = await navigator.permissions.query({ name: 'local-network-access' });
    if (p.state === 'denied') return 'blocked';
  } catch (e) { /* 이 권한을 모르는 브라우저 */ }
  return 'off';
}

async function checkProxy(silent = false) {
  try {
    const r = await fetch(`${KIS}/health`, { signal: AbortSignal.timeout(2000) });
    if (r.ok) {
      try { _proxyVer = (await r.json()).version || ''; } catch (e) { _proxyVer = ''; }
      const wasOk = _proxyOk;
      _proxyOk = true;
      if (!verGte(_proxyVer, PROXY_MIN)) {
        showProxyBanner(false, `프록시 업데이트 필요 — 실행 중 v${_proxyVer || '?'}, 필요 v${PROXY_MIN} 이상 (새 kis_proxy.py로 exe 다시 빌드)`);
        return true;
      }
      if (!wasOk || !silent) showProxyBanner(true, `프록시 서버 연결됨 (v${_proxyVer}) — KIS API 시세 조회 가능합니다`);
      return true;
    }
  } catch (e) { /* 아래에서 원인 진단 */ }
  _proxyOk = false;
  const why = await diagnoseProxy();
  if (why === 'old') {
    showProxyBanner(false, `프록시 업데이트 필요 — 실행 중인 프록시가 이 주소(${location.origin === 'null' ? '로컬 파일' : location.host})를 허용하지 않습니다. 기존 프록시를 끄고 새 kis_proxy.py로 exe를 다시 빌드하세요`);
  } else if (why === 'blocked') {
    showProxyBanner(false, '브라우저가 로컬 네트워크 접근을 차단했습니다 — 주소창 왼쪽 아이콘 → 사이트 설정에서 "로컬 네트워크"를 허용 후 새로고침');
  } else {
    showProxyBanner(false, '프록시 서버가 꺼져 있습니다 (포트 5000)', true);
  }
  return false;
}

    user_id: _cloudUser.id, accounts: S.accounts, history: getHistory(), updated_at: now,
  });
  if (error) { setCloudState('error', error.message); return; }
  localStorage.setItem('rb2_cloud_ts', now);
  localStorage.removeItem('rb2_dirty');
  setCloudState('saved');
}

// 서버 데이터 확인 → 서버가 새것이면 받아오고, 이 기기만 바뀌었으면 올림
async function cloudPull() {
  if (!sb || !_cloudUser || _cloudBusy) return;
  if (_cloudTimer) { await cloudPush(); return; }      // 올릴 게 대기 중이면 먼저 올림
  _cloudBusy = true;
  try {
    setCloudState('saving');
    const { data, error } = await sb.from(SB_TABLE)
      .select('accounts,history,updated_at').eq('user_id', _cloudUser.id).maybeSingle();
    if (error) { setCloudState('error', error.message); return; }
    const lastSynced = localStorage.getItem('rb2_cloud_ts') || '';
    // 한 번도 동기화 안 한 기기에 데이터가 있으면 "동기화 안 된 변경"으로 취급
    const dirty = localStorage.getItem('rb2_dirty') === '1' || (!lastSynced && S.accounts.length > 0);
    if (!data) {                                    // 서버가 비어 있음 → 이 기기 데이터로 시작
      if (S.accounts.length) await cloudPush(); else setCloudState('saved');
      return;
    }
    if (data.updated_at === lastSynced) {           // 서버는 그대로
      if (dirty) await cloudPush(); else setCloudState('saved');
      return;
    }
    // 서버가 다른 기기에서 바뀜
    if (dirty && !confirm('이 기기에 서버와 다른 데이터가 있습니다.\n\n[확인] 서버 데이터로 바꾸기\n[취소] 이 기기 데이터를 서버에 올리기')) {
      await cloudPush();
      return;
    }
    cloudApply(data);
  } finally { _cloudBusy = false; }
}

function cloudApply(data) {
  _cloudApplying = true;
  try {
    S.accounts = sanitizeAccounts(Array.isArray(data.accounts) ? data.accounts : []);
    localStorage.setItem('rb2_history', JSON.stringify(data.history || {}));
    save();
  } finally { _cloudApplying = false; }
  localStorage.setItem('rb2_cloud_ts', data.updated_at);
  localStorage.removeItem('rb2_dirty');
  if (S.selAcc >= S.accounts.length) S.selAcc = 0;
  if (S.detailIdx >= 0) { if (S.detailIdx < S.accounts.length) renderDetailContent(S.detailIdx); else closeDetail(); }
  render();
  setCloudState('saved');
}

// 1단계: 이메일로 로그인 코드 보내기
async function cloudSendCode() {
  if (!sb) return;
  const email = (document.getElementById('cloud-email')?.value || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('이메일 주소를 확인하세요'); return; }
  const btn = document.getElementById('cloud-send-btn');
  if (btn) { btn.disabled = true; btn.textContent = '보내는 중…'; }
  const redirect = location.protocol.startsWith('http') ? location.origin + location.pathname : CLOUD_HOME;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: redirect } });
  if (error) {
    if (btn) { btn.disabled = false; btn.textContent = '로그인 메일 받기'; }
    alert('코드 전송 실패: ' + error.message);
    return;
  }
  try { localStorage.setItem('rb2_cloud_email', email); } catch (e) {}
  _otpEmail = email;
  renderSettingsContent();
  setTimeout(() => document.getElementById('cloud-code')?.focus(), 50);
}
// 2단계: 메일로 받은 코드 확인
async function cloudVerifyCode() {
  if (!sb || !_otpEmail) return;
  const token = (document.getElementById('cloud-code')?.value || '').replace(/\D/g, '');
  if (token.length < 6) { alert('메일로 받은 숫자 코드를 입력하세요'); return; }
  const btn = document.getElementById('cloud-verify-btn');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
  const { error } = await sb.auth.verifyOtp({ email: _otpEmail, token, type: 'email' });
  if (error) {
    if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
    alert('코드가 맞지 않거나 만료되었습니다. 다시 받아 주세요.\n(' + error.message + ')');
    return;
  }
  _otpEmail = '';   // 이후는 onAuthStateChange 가 처리 (동기화 + 화면 갱신)
}
function cloudResetCode() { _otpEmail = ''; renderSettingsContent(); }
async function cloudLogout() {
  if (!confirm('로그아웃할까요?\n이 기기의 데이터는 그대로 남고, 자동 동기화만 멈춥니다.')) return;
  await sb.auth.signOut();
}
async function cloudSyncNow() { await cloudPull(); }

function cloudBoxHtml() {
  const box = (inner) => `<div style="margin:12px 12px 4px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--s1)">
    <div style="font-size:var(--f-sm);font-weight:700;margin-bottom:8px">☁ 클라우드 동기화</div>${inner}</div>`;
  const btn = (label, fn, primary) => `<button onclick="${fn}" style="padding:9px 14px;border-radius:9px;cursor:pointer;font-size:var(--f-sm);font-weight:600;
    border:1px solid ${primary ? 'var(--accent)' : 'var(--bd)'};background:${primary ? 'var(--accent)' : 'var(--s2)'};color:${primary ? '#fff' : 'var(--t1)'}">${label}</button>`;
  const inp = (id, type, ph, val, extra) => `<input id="${id}" type="${type}" placeholder="${ph}" value="${val}" ${extra || ''}
    style="flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--t1);font-size:var(--f-sm)">`;
  if (!sb) return box(`<div style="font-size:var(--f-xs);color:var(--t3)">동기화 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>`);
  if (!_cloudUser && !_otpEmail) {
    let last = ''; try { last = clean(localStorage.getItem('rb2_cloud_email') || ''); } catch (e) {}
    return box(`<div style="font-size:var(--f-xs);color:var(--t2);margin-bottom:10px">이메일로 로그인하면 계좌·종목·자산추이가 모든 기기에서 같게 유지됩니다. (API 키는 올라가지 않음)</div>
    <div style="display:flex;gap:8px">${inp('cloud-email', 'email', '이메일 주소', last, 'autocomplete="email" onkeydown="if(event.key===\'Enter\')cloudSendCode()"')}
    <button id="cloud-send-btn" onclick="cloudSendCode()" style="padding:9px 14px;border-radius:9px;cursor:pointer;font-size:var(--f-sm);font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;white-space:nowrap">로그인 메일 받기</button></div>`);
  }
  if (!_cloudUser) return box(`<div style="font-size:var(--f-sm);color:var(--t1);margin-bottom:6px">📧 ${clean(_otpEmail)} 로 메일을 보냈습니다</div>
    <div style="font-size:var(--f-xs);color:var(--t2);margin-bottom:10px">메일의 <b>Sign in</b> 링크를 <b>이 기기의 브라우저</b>에서 누르면 로그인됩니다. (스팸함도 확인)<br>메일에 숫자 코드가 있으면 아래에 입력해도 됩니다.</div>
    <div style="display:flex;gap:8px">${inp('cloud-code', 'text', '숫자 코드', '', 'inputmode="numeric" autocomplete="one-time-code" maxlength="10" onkeydown="if(event.key===\'Enter\')cloudVerifyCode()"')}
    <button id="cloud-verify-btn" onclick="cloudVerifyCode()" style="padding:9px 14px;border-radius:9px;cursor:pointer;font-size:var(--f-sm);font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;white-space:nowrap">로그인</button></div>
    <div style="margin-top:8px"><span onclick="cloudResetCode()" style="font-size:var(--f-xs);color:var(--t3);cursor:pointer;text-decoration:underline">다른 이메일 / 코드 다시 받기</span></div>`);
  return box(`<div style="font-size:var(--f-xs);color:var(--t2)">${clean(_cloudUser.email || '')}</div>
    <div id="cloud-status" style="font-size:var(--f-xs);color:var(--t3);margin:4px 0 10px">${cloudStatusText()}</div>
    <div style="display:flex;gap:8px">${btn('↻ 지금 동기화', 'cloudSyncNow()', false)}${btn('로그아웃', 'cloudLogout()', false)}</div>`);
}

function initCloud() {
  if (!sb) return;
  const h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (h.get('error_description')) {
    alert('로그인 링크 오류: ' + h.get('error_description').replace(/\+/g, ' ') + '\n\n링크는 한 번만, 짧은 시간 안에만 쓸 수 있습니다. 메일을 다시 받아 주세요.');
    history.replaceState(null, '', location.pathname);
  }
  sb.auth.onAuthStateChange((ev, session) => {
    const u = session?.user || null;
    const changed = (u?.id || null) !== (_cloudUser?.id || null);
    _cloudUser = u;
    if (!u) { clearTimeout(_cloudTimer); _cloudTimer = null; setCloudState('off'); }
    // 콜백 안에서 바로 supabase 호출하면 멈출 수 있어 다음 틱으로 미룸
    if (u && changed) setTimeout(cloudPull, 0);
    if (u) _otpEmail = '';
    if (ev === 'SIGNED_IN' && changed) showProxyBanner(true, `☁ 로그인됨 (${clean(u.email || '')}) — 동기화를 시작합니다`);
    if (changed && document.getElementById('settings-panel').classList.contains('open')) renderSettingsContent();
  });
  // 다른 기기에서 바꾼 내용: 이 탭으로 돌아올 때 확인
  document.addEventListener('visibilitychange', () => { if (!document.hidden && _cloudUser) cloudPull(); });
}

startProxyPoll();
document.getElementById('app-ver').textContent='v'+APP_VERSION;
initCloud();
